config:
  target: "https://chathub-backend-cq3x.onrender.com"
  phases:
    - name: "Warm up"
      duration: 30
      arrivalRate: 10
      rampTo: 50
    - name: "Ramp to 500"
      duration: 120
      arrivalRate: 50
      rampTo: 500
    - name: "Ramp to 1000"
      duration: 180
      arrivalRate: 500
      rampTo: 1000
    - name: "Sustain 1000"
      duration: 120
      arrivalRate: 1000
  engines:
    socketio-v3: {}
  processor: "./load-test-processor.js"

scenarios:
  - name: "Socket.io connection with messaging"
    engine: "socketio-v3"
    weight: 100
    flow:
      - connect:
          auth:
            token: "{{ jwt_token }}"
      - think: 2
      - emit:
          event: "send_message"
          data:
            conversationId: "test-conv"
            content: "Load test message"
            messageType: "text"
      - think: 5
      - loop:
          - think: 5
          - emit:
              event: "send_message"
              data:
                conversationId: "test-conv"
                content: "Load test message"
                messageType: "text"
          - think: 2
        count: 20
      - think: 5
      - disconnect: true